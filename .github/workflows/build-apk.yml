
name: Compilar ATENA MIC v0.6

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontro sdkmanager"
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ejecutar pruebas
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ATENA-MIC-v0-6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
